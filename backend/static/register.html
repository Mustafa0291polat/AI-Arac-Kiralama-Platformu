<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sisteme Kayıt Ol</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-extrabold text-slate-800">Kayıt Ol</h2>
            <a href="/" class="text-sm text-sky-600 font-semibold">&larr; Ana Sayfa</a>
        </div>
        <form id="registerForm" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-sm font-semibold mb-1">Ad</label><input type="text" id="firstName" class="w-full p-2.5 bg-slate-50 border rounded-lg" required></div>
                <div><label class="block text-sm font-semibold mb-1">Soyad</label><input type="text" id="lastName" class="w-full p-2.5 bg-slate-50 border rounded-lg" required></div>
            </div>
            <div><label class="block text-sm font-semibold mb-1">E-posta</label><input type="email" id="email" class="w-full p-2.5 bg-slate-50 border rounded-lg" required></div>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-sm font-semibold mb-1">Telefon</label><input type="tel" id="phone" class="w-full p-2.5 bg-slate-50 border rounded-lg" required></div>
                <div><label class="block text-sm font-semibold mb-1">Yaş</label><input type="number" id="age" min="18" class="w-full p-2.5 bg-slate-50 border rounded-lg" required></div>
            </div>
            <div><label class="block text-sm font-semibold mb-1">Şifre</label><input type="password" id="password" class="w-full p-2.5 bg-slate-50 border rounded-lg" required></div>
            <button type="button" onclick="registerUser()" class="w-full mt-6 bg-sky-600 text-white font-bold py-3 rounded-lg">Hesabımı Oluştur</button>
        </form>
        <div id="registerMessage" class="mt-6 text-center text-sm hidden p-3 rounded-lg"></div>
    </div>
    <script>
    async function registerUser() {
        const userData = {
            first_name: document.getElementById('firstName').value, last_name: document.getElementById('lastName').value,
            email: document.getElementById('email').value, phone_number: document.getElementById('phone').value,
            age: parseInt(document.getElementById('age').value), password: document.getElementById('password').value
        };
        const messageBox = document.getElementById('registerMessage');
        try {
            const response = await fetch('/api/register/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(userData) });
            const data = await response.json();
            if (response.ok) {
                messageBox.innerHTML = "✅ Kayıt başarılı! Yönlendiriliyorsunuz..."; messageBox.className = "mt-6 text-center font-bold block bg-green-100 text-green-700 p-3 rounded-lg";
                setTimeout(() => window.location.href = "/giris", 2000);
            } else {
                messageBox.innerHTML = "❌ Hata: " + (data.detail || "Bir sorun oluştu."); messageBox.className = "mt-6 text-center font-bold block bg-red-100 text-red-700 p-3 rounded-lg";
            }
        } catch (error) { console.error(error); }
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — AI Araç Kiralama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0% { transform: translateY(0px) translateX(0px) scale(1); }
            33% { transform: translateY(-30px) translateX(40px) scale(1.05); }
            66% { transform: translateY(20px) translateX(-30px) scale(0.95); }
            100% { transform: translateY(0px) translateX(0px) scale(1); }
        }
        .animate-blob-1 { animation: float 12s ease-in-out infinite; }
        .animate-blob-2 { animation: float 15s ease-in-out infinite reverse; }
        .glow-shadow { box-shadow: 0 0 30px rgba(14, 165, 233, 0.15); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden flex items-center justify-center p-4">

    <div class="fixed inset-0 pointer-events-none -z-10">
        <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-sky-600/20 blur-[130px] animate-blob-1"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-emerald-500/10 blur-[150px] animate-blob-2"></div>
    </div>

    <div class="w-full max-w-md rounded-[2.5rem] border border-white/10 bg-slate-900/40 p-8 sm:p-10 shadow-2xl backdrop-blur-2xl glow-shadow">
        <div class="flex justify-between items-center mb-2">
            <p class="uppercase text-xs font-bold tracking-[0.3em] text-sky-400">Üyelik</p>
            <a href="/" class="text-sm text-slate-400 hover:text-sky-300 transition-colors">&larr; Ana Sayfa</a>
        </div>
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-white via-sky-200 to-emerald-200 mb-8">Giriş Yap</h1>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-medium text-slate-400 mb-1.5 ml-1">E-posta</label>
                <input id="email" type="email" placeholder="ornek@gmail.com" autocomplete="email" required
                       class="w-full rounded-2xl border border-white/5 bg-slate-950/60 px-5 py-3.5 text-sm text-slate-200 outline-none focus:border-sky-500 transition-colors">
            </div>
            <div>
                <label for="password" class="block text-xs font-medium text-slate-400 mb-1.5 ml-1">Şifre</label>
                <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required
                       class="w-full rounded-2xl border border-white/5 bg-slate-950/60 px-5 py-3.5 text-sm text-slate-200 outline-none focus:border-sky-500 transition-colors">
            </div>

            <button id="submitBtn" type="submit"
                    class="w-full rounded-full bg-gradient-to-r from-sky-500 to-emerald-500 px-8 py-4 text-sm font-bold text-white transition transform hover:scale-[1.02] shadow-[0_0_20px_rgba(14,165,233,0.3)] hover:shadow-[0_0_30px_rgba(14,165,233,0.5)] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100">
                Giriş Yap
            </button>
        </form>

        <div id="loginMessage" class="hidden mt-5 rounded-2xl border p-4 text-sm font-medium text-center backdrop-blur-md"></div>

        <p class="mt-6 text-center text-sm text-slate-500">
            Hesabın yok mu?
            <a href="/kayit" class="text-sky-400 font-bold hover:text-sky-300 hover:underline transition-colors">Hemen Kayıt Ol</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageBox = document.getElementById('loginMessage');

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `mt-5 rounded-2xl border p-4 text-sm font-medium text-center backdrop-blur-md block ${
                type === 'success'
                    ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-300'
                    : 'bg-rose-500/10 border-rose-500/20 text-rose-300'
            }`;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginData = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Giriş yapılıyor...';

            try {
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginData)
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage('✅ Giriş başarılı! Yönlendiriliyorsun...', 'success');
                    localStorage.setItem('loggedInUser', JSON.stringify(data.user));
                    setTimeout(() => window.location.href = '/', 1200);
                } else {
                    showMessage('❌ ' + (data.detail || 'Giriş başarısız.'), 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Giriş Yap';
                }
            } catch (error) {
                showMessage('❌ Sunucuya bağlanılamadı. Lütfen daha sonra tekrar deneyin.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Giriş Yap';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Araç Kiralama - Kayıt Ol</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-blue-600 text-center">Platforma Kayıt Ol</h2>
        <form>
            <div class="mb-4">
                <label class="block text-gray-700">Ad Soyad</label>
                <input type="text" class="w-full px-3 py-2 border rounded-lg" placeholder="Mustafa Polat">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">E-posta</label>
                <input type="email" class="w-full px-3 py-2 border rounded-lg" placeholder="mustafa3polat@gmail.com">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700">Üyelik Tipi</label>
                <select class="w-full px-3 py-2 border rounded-lg">
                    <option>Araç Kiralamak İstiyorum</option>
                    <option>Araç Sahibiyim</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Kayıt Ol</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Araç Kiralama Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-slate-900">AI Destekli Araç Filtreleme</h1>
            <p class="mt-2 text-slate-600">Doğal dil ile arama yapın, sonuçları backend tarafından otomatik filtreleyelim.</p>
        </header>

        <section class="grid gap-6 lg:grid-cols-2 mb-8">
            <div class="bg-white rounded-3xl p-6 shadow-md">
                <h2 class="text-2xl font-semibold mb-4">Doğal Dil Arama</h2>
                <textarea id="promptInput" rows="5" class="w-full border border-slate-300 rounded-2xl p-4 resize-none" placeholder="Örn: Ankara'da 800 bin altı, otomatik vites, beyaz sedan araç..." spellcheck="false"></textarea>
                <button id="searchBtn" class="mt-4 w-full bg-sky-600 text-white py-3 rounded-full hover:bg-sky-700 transition">Arama Yap</button>
                <div id="searchMessage" class="hidden mt-4 p-4 rounded-2xl text-slate-800"></div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-md">
                <h2 class="text-2xl font-semibold mb-4">Yeni Araç Ekle</h2>
                <form id="carForm" class="space-y-4">
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="owner_username" type="text" placeholder="Sahip Kullanıcı Adı" class="w-full border border-slate-300 rounded-2xl px-4 py-3" required>
                        <input id="city" type="text" placeholder="İl" class="w-full border border-slate-300 rounded-2xl px-4 py-3" required>
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="district" type="text" placeholder="İlçe" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                        <input id="price" type="number" placeholder="Fiyat" class="w-full border border-slate-300 rounded-2xl px-4 py-3" required>
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="year" type="number" placeholder="Yıl" class="w-full border border-slate-300 rounded-2xl px-4 py-3" required>
                        <input id="km" type="number" placeholder="KM" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="fuel_type" type="text" placeholder="Yakıt Tipi" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                        <input id="transmission" type="text" placeholder="Vites" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="body_type" type="text" placeholder="Kasa Tipi" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                        <input id="power_range" type="text" placeholder="Motor Gücü" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="engine_size" type="text" placeholder="Motor Hacmi" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                        <input id="drive_type" type="text" placeholder="Çekiş" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="color" type="text" placeholder="Renk" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                        <input id="seller_type" type="text" placeholder="Kimden" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <input id="warranty" type="text" placeholder="Garanti" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                        <input id="heavy_damage" type="text" placeholder="Ağır Hasar" class="w-full border border-slate-300 rounded-2xl px-4 py-3">
                    </div>
                    <textarea id="description" rows="3" placeholder="Açıklama" class="w-full border border-slate-300 rounded-2xl px-4 py-3 resize-none"></textarea>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-full hover:bg-emerald-700 transition">Aracı Kaydet</button>
                    <div id="carMessage" class="hidden mt-3 p-3 rounded-2xl text-slate-800"></div>
                </form>
            </div>
        </section>

        <section class="bg-white rounded-3xl p-6 shadow-md">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-semibold">Eşleşen Araçlar</h2>
                <button id="loadCars" class="px-4 py-2 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-200">Tüm araçları yükle</button>
            </div>
            <div id="carResults" class="space-y-4"></div>
        </section>
    </div>

    <script>
        const BACKEND_URL = 'http://127.0.0.1:8000';
        const searchBtn = document.getElementById('searchBtn');
        const carForm = document.getElementById('carForm');
        const loadCarsBtn = document.getElementById('loadCars');
        const carResults = document.getElementById('carResults');
        const searchMessage = document.getElementById('searchMessage');
        const carMessage = document.getElementById('carMessage');

        function showMessage(box, text, type = 'success') {
            box.classList.remove('hidden');
            box.textContent = text;
            box.className = `mt-4 p-4 rounded-2xl text-slate-900 ${type === 'success' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`;
        }

        function renderCars(cars) {
            if (!cars || cars.length === 0) {
                carResults.innerHTML = '<div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 text-slate-600">Herhangi bir araç bulunamadı.</div>';
                return;
            }

            carResults.innerHTML = cars.map(car => `
                <article class="rounded-3xl border border-slate-200 bg-slate-50 p-5 shadow-sm">
                    <div class="flex flex-col gap-2 sm:flex-row sm:justify-between sm:items-center">
                        <div>
                            <h3 class="text-xl font-semibold">${car.city} ${car.district || ''}</h3>
                            <p class="text-slate-600">${car.body_type || 'Araç tipi yok'} - ${car.transmission || 'Vites yok'}</p>
                        </div>
                        <span class="text-lg font-bold text-sky-700">${car.price} TL</span>
                    </div>
                    <div class="mt-4 grid gap-2 sm:grid-cols-3 text-sm text-slate-700">
                        <span>Yıl: ${car.year}</span>
                        <span>KM: ${car.km ?? '-'}</span>
                        <span>Yakıt: ${car.fuel_type ?? '-'}</span>
                        <span>Renk: ${car.color ?? '-'}</span>
                        <span>Çekiş: ${car.drive_type ?? '-'}</span>
                        <span>Satıcı: ${car.seller_type ?? '-'}</span>
                    </div>
                    <p class="mt-4 text-slate-700">${car.description || 'Açıklama yok.'}</p>
                </article>
            `).join('');
        }

        async function fetchCars() {
            try {
                const response = await fetch(`${BACKEND_URL}/cars/`);
                const cars = await response.json();
                renderCars(cars);
            } catch (error) {
                showMessage(carMessage, 'Araçları yüklerken hata oluştu. Backend çalışıyor mu?', 'error');
            }
        }

        async function searchPrompt() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                showMessage(searchMessage, 'Lütfen bir arama girin.', 'error');
                return;
            }

            searchMessage.classList.add('hidden');
            try {
                const response = await fetch(`${BACKEND_URL}/filter/prompt`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt })
                });
                const data = await response.json();

                if (!response.ok) {
                    showMessage(searchMessage, data.detail || 'Filtreleme sırasında hata oluştu.', 'error');
                    return;
                }

                showMessage(searchMessage, 'Filtreleme başarılı. Eşleşen araçlar listelendi.', 'success');
                renderCars(data.matched_cars);
            } catch (error) {
                showMessage(searchMessage, 'AI filtreleme isteği gönderilemedi. Backend çalışıyor mu?', 'error');
            }
        }

        async function createCar(event) {
            event.preventDefault();
            carMessage.classList.add('hidden');

            const payload = {
                owner_username: document.getElementById('owner_username').value,
                city: document.getElementById('city').value,
                district: document.getElementById('district').value || null,
                price: Number(document.getElementById('price').value),
                year: Number(document.getElementById('year').value),
                fuel_type: document.getElementById('fuel_type').value || null,
                transmission: document.getElementById('transmission').value || null,
                km: document.getElementById('km').value ? Number(document.getElementById('km').value) : null,
                body_type: document.getElementById('body_type').value || null,
                power_range: document.getElementById('power_range').value || null,
                engine_size: document.getElementById('engine_size').value || null,
                drive_type: document.getElementById('drive_type').value || null,
                color: document.getElementById('color').value || null,
                warranty: document.getElementById('warranty').value || null,
                heavy_damage: document.getElementById('heavy_damage').value || null,
                seller_type: document.getElementById('seller_type').value || null,
                description: document.getElementById('description').value || null
            };

            try {
                const response = await fetch(`${BACKEND_URL}/cars/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    showMessage(carMessage, data.detail || 'Araç eklenirken hata oluştu.', 'error');
                    return;
                }

                showMessage(carMessage, 'Araç kaydedildi. Liste güncelleniyor.', 'success');
                carForm.reset();
                fetchCars();
            } catch (error) {
                showMessage(carMessage, 'Backend sunucusuna bağlanılamadı.', 'error');
            }
        }

        searchBtn.addEventListener('click', searchPrompt);
        carForm.addEventListener('submit', createCar);
        loadCarsBtn.addEventListener('click', fetchCars);

        fetchCars();
    </script>
</body>
</html>
